; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32dev
framework = espidf
build_flags = -DCORE_DEBUG_LEVEL=5
monitor_speed = 115200
check_tool = cppcheck
check_skip_packages = yes
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem
board_build.embed_txtfiles = 
	src/webcontent/index.html
	src/webcontent/favicon.png
